name: Reproducibility checks

on:
  push:
    branches:
      - main
      - arena/1bca0aa4-gemsdoe90
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned validation dependencies
        run: python -m pip install numpy==2.1.3 scipy==1.17.1 rasterio==1.4.4 pytest==9.1.1
      - name: Run unit tests
        run: python -m pytest -q
      - name: Reject merge conflict markers
        run: "! grep -rn '^<<<<<<<\\|^>>>>>>>' --include='*.py' --include='*.md' ."
