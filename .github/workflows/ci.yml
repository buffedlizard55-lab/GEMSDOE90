name: Reproducibility checks

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Run standalone automated GeoTIFF submission gate
        run: python -m src.auto_validator docs/downloads/gemsdoe90-h90-cc-mpst-submod38k-20261024-d76ac964-zeros.tif
      - name: Reject merge conflict markers
        run: "! grep -rn '^<<<<<<<\\|^>>>>>>>' --include='*.py' --include='*.md' --include='*.html' ."
